<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Pro & Analyzer Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --bg-input: #21262d;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #2ea44f;
            --accent-red: #da3633;
            --accent-yellow: #d29922;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--accent-blue);
        }

        .nav-tabs {
            display: flex;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 15px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
            font-weight: bold;
        }

        .container {
            padding: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--accent-blue);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-success { background-color: var(--accent-green); }
        .btn-danger { background-color: var(--accent-red); }

        canvas {
            max-width: 100%;
            border: 1px solid var(--border-color);
            background-color: #000;
            border-radius: 4px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
        }
        .badge-100 { background-color: #00e676; color: #000; }
        .badge-70 { background-color: #ffeb3b; color: #000; }
        .badge-danger { background-color: #ff5252; color: #fff; }

        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            padding: 8px;
            border-radius: 4px;
        }

        .check-item input[type="checkbox"] { width: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
        }

        th { background-color: var(--bg-input); color: var(--accent-blue); }
        .row-buy { color: #00e676; font-weight: bold; }
        .row-sell { color: #ff5252; font-weight: bold; }
        .outcome-win { background-color: rgba(0, 230, 118, 0.15); color: #00e676; text-align: center; font-weight: bold;}
        .outcome-loss { background-color: rgba(255, 82, 82, 0.15); color: #ff5252; text-align: center; font-weight: bold;}
        .outcome-be { background-color: rgba(210, 153, 34, 0.15); color: #ffeb3b; text-align: center; font-weight: bold;}

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .widget {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }

        .widget .title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        .widget .value { font-size: 1.8rem; font-weight: bold; }
        .widget .value.green { color: #00e676; }
        .widget .value.red { color: #ff5252; }
    </style>
</head>
<body>

<header>
    <h1>📊 Trading Journal Pro & Analyzer Suite</h1>
    <div style="font-size: 0.85rem; color: var(--text-muted);" id="liveClock"></div>
</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'journal')">📝 Entry Journal & Image Analyzer</button>
    <button class="tab-btn" onclick="switchTab(event, 'logs')">📈 Trading Log Data</button>
    <button class="tab-btn" onclick="switchTab(event, 'analytics')">📊 Live Analytics & Performance</button>
</div>

<div class="container">

    <div id="journal" class="
